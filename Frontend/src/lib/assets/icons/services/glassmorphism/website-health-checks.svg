<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" aria-labelledby="title desc" role="img">
  <title id="title">Website health checks glass icon</title>
  <desc id="desc">Centered frosted browser with balanced pulse and shield to represent website health checks.</desc>
  <defs>
    <linearGradient id="bgHealth" x1="14" y1="14" x2="114" y2="114" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#67e8f9" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0.24"/>
    </linearGradient>
    <linearGradient id="strokeHealth" x1="16" y1="16" x2="108" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.84"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="blurHealth" x="0" y="0" width="128" height="128" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <circle cx="30" cy="30" r="12" fill="#22d3ee" fill-opacity="0.28" filter="url(#blurHealth)"/>
  <circle cx="96" cy="98" r="14" fill="#34d399" fill-opacity="0.26" filter="url(#blurHealth)"/>

  <rect x="14" y="14" width="100" height="100" rx="24" fill="url(#bgHealth)"/>
  <rect x="14" y="14" width="100" height="100" rx="24" stroke="url(#strokeHealth)" stroke-width="2.5"/>

  <rect x="26" y="30" width="76" height="64" rx="12" fill="#ffffff" fill-opacity="0.42"/>
  <rect x="26" y="30" width="76" height="64" rx="12" stroke="#ffffff" stroke-opacity="0.72" stroke-width="2.1"/>
  <path d="M26 46h76" stroke="#ffffff" stroke-opacity="0.74" stroke-width="2"/>
  <circle cx="35" cy="38" r="2.2" fill="#ffffff" fill-opacity="0.78"/>
  <circle cx="43" cy="38" r="2.2" fill="#ffffff" fill-opacity="0.56"/>

  <path d="M38 70h10l5-9 7 17 6-11h7" stroke="#0f172a" stroke-opacity="0.62" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M77 59v10c0 9 7 16 15 19 8-3 15-10 15-19V59l-15-6-15 6z" fill="#ffffff" fill-opacity="0.48"/>
  <path d="M77 59v10c0 9 7 16 15 19 8-3 15-10 15-19V59l-15-6-15 6z" stroke="#ffffff" stroke-opacity="0.8" stroke-width="2"/>
  <path d="m85.8 69.5 4.2 4.2 6.6-7.6" stroke="#0f172a" stroke-opacity="0.62" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
